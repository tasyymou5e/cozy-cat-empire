<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>" />
    <title>Cat Farm - Collect & Care for Cats! 🐱</title>
    <meta name="description" content="Build your cat empire! Collect strays, adopted and pure breed cats. Do chores, enter cat shows, and upgrade from apartment to farm!" />
    <meta name="author" content="Lovable" />

    <meta property="og:title" content="Cat Farm - Collect & Care for Cats!" />
    <meta property="og:description" content="Build your cat empire! Collect strays, adopted and pure breed cats." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    
    <!-- Global error handler - catches errors before React loads -->
    <script>
      window.__EARLY_ERRORS = [];
      window.onerror = function(message, source, lineno, colno, error) {
        console.error('[EARLY ERROR]', { message, source, lineno, colno, error });
        window.__EARLY_ERRORS.push({ message, source, lineno, colno, stack: error?.stack, time: Date.now() });
        // Show error on screen if root is empty
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding:20px;font-family:monospace;background:#fee;border:2px solid #f00;margin:20px;border-radius:8px;">' +
            '<h2 style="color:#c00;">⚠️ Early Initialization Error</h2>' +
            '<p><strong>Message:</strong> ' + message + '</p>' +
            '<p><strong>Source:</strong> ' + source + ':' + lineno + ':' + colno + '</p>' +
            '<pre style="background:#fff;padding:10px;overflow:auto;max-height:200px;">' + (error?.stack || 'No stack trace') + '</pre>' +
            '</div>';
        }
        return false;
      };
      window.onunhandledrejection = function(event) {
        console.error('[EARLY PROMISE REJECTION]', event.reason);
        window.__EARLY_ERRORS.push({ type: 'promise', reason: String(event.reason), stack: event.reason?.stack, time: Date.now() });
      };
      console.log('[EARLY] Global error handlers installed');
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
